[package]
# The crate is `myd-tui` on crates.io because `myd` was already taken by an
# unrelated package. Both the binary and the library target keep the name
# `myd` (see [lib] and [[bin]] below), so `cargo install myd-tui` installs a
# `myd` command and every `myd::` path in the tests still resolves.
name = "myd-tui"
version = "1.6.0"
edition = "2021"
authors = ["Juan Orlandini <tachijuan@gmail.com>"]
description = "A terminal file browser with size bars, a treemap, previews, archives and SFTP"
repository = "https://github.com/tachijuan/myd"
homepage = "https://github.com/tachijuan/myd"
documentation = "https://github.com/tachijuan/myd"
license = "MIT"
readme = "../README.md"
keywords = ["tui", "file-manager", "terminal", "sftp", "treemap"]
categories = ["command-line-utilities", "filesystem"]
# Verified against the toolchain this is developed on. Older releases may work
# but are not tested, so the floor is stated rather than guessed downward.
rust-version = "1.85"
exclude = ["scripts/", "tests/fixtures/"]

[features]
# The diagnostic binaries in src/bin are gated behind this and off by default,
# so `cargo build --release` produces `myd` alone. They are development tools —
# an escape-sequence dumper, a terminal capability probe, and a headless
# transfer benchmark — and shipping them in a release tarball invites someone to
# run one and wonder what it is for.
#
#     cargo build --features tools --bin myd-transfer
tools = []

[lib]
# Stated explicitly rather than inherited from the package name, which is now
# `myd-tui`. Without this the library would be `myd_tui` and every `myd::`
# path in tests/ and the benches would stop resolving.
name = "myd"
path = "src/lib.rs"

[[bin]]
name = "myd"
path = "src/main.rs"

[[bin]]
name = "myd-escape"
path = "src/bin/myd-escape.rs"
required-features = ["tools"]

[[bin]]
name = "myd-sizeprobe"
path = "src/bin/myd-sizeprobe.rs"
required-features = ["tools"]

[[bin]]
name = "myd-transfer"
path = "src/bin/myd-transfer.rs"
required-features = ["tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
regex = "1"
filesize = "0.2"
libc = "0.2"
dashmap = "6"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
async-trait = "0.1.91"
futures = "0.3.33"
url = "2.5.8"
russh = "0.62.4"
openssh-sftp-client = "0.15.7"
ssh2-config = "0.7.1"
bytes = "1.12.1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy", "dump-load", "plist-load", "yaml-load"] }
tempfile = "3"
zip = { version = "4.6", default-features = false, features = ["deflate", "bzip2", "deflate64", "lzma", "zstd", "time"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
liblzma = "0.4"
zstd = "0.13"
# `compress` is on for the test fixtures, which build a 7z in memory rather
# than committing a binary. Cargo unifies features across dev and normal
# dependencies, so a separate dev entry would not have kept it out of the
# release binary — it would only have hidden that it was there.
sevenz-rust2 = { version = "0.21", default-features = false, features = ["bzip2", "ppmd", "util", "aes256", "deflate", "zstd", "compress"] }
rars = "0.4"
memmap2 = "0.9.11"
# Line editing for the text fields: the readline bindings people expect from a
# shell prompt (C-a, C-e, C-w, C-u, C-k, alt-b/f/d, word-wise C-arrows), plus
# the width-aware cursor and scroll arithmetic that keeps a long name usable in
# a narrow box.
#
# Pinned to 0.13.0 deliberately. 0.14+ require crossterm 0.29 and ratatui 0.30,
# which would compile a *second* copy of each alongside the ones myd uses — and
# a `KeyEvent` from the other crossterm is a different type, so the event loop's
# keys would not even typecheck against it. 0.13.0 resolves against crossterm
# 0.28.1, the version already in the tree, and adds exactly one package.
#
# Only the `crossterm` feature: the ratatui backends are what pull the newer
# ratatui in, and myd does its own rendering anyway. Ctrl-D is not in the
# crate's key map (it stops at `Delete`); `text_field` adds it.
tui-input = { version = "0.13.0", default-features = false, features = ["crossterm"] }
# Already in the tree via ratatui and tui-input; named here because
# `text_field` measures cursor columns with it directly, and a dependency used
# in this crate's own code should be declared by it rather than borrowed.
unicode-width = "0.1.14"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
# Thin LTO across 16 codegen units rather than full LTO into one. Full LTO with
# codegen-units = 1 serialises the whole final crate through one thread: it was
# ~39s of a ~58s build on a 20-core machine, while the dependencies — which do
# parallelise — took the rest. Thin/16 builds the same crate in ~8s.
#
# Measured, not assumed: a repeated directory-size walk (the hottest non-UI
# path) runs at 0.46s under both, and the binary grows 6MB -> 7MB. Paying 5x the
# build time for no measurable speed-up is not a trade worth keeping.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
