[package]
name = "myd"
version = "0.9.3"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
regex = "1"
filesize = "0.2"
libc = "0.2"
dashmap = "6"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
async-trait = "0.1.91"
futures = "0.3.33"
url = "2.5.8"
russh = "0.62.4"
openssh-sftp-client = "0.15.7"
ssh2-config = "0.7.1"
bytes = "1.12.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
