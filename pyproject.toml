[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "file-browser-tui"
version = "0.1.0"
description = "A vi-like TUI file browser and manager built with Textual"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.0,<9.0.0",
]

[project.scripts]
file-browser = "file_browser_tui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
]
